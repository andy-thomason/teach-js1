<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game - Learn JavaScript</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            text-align: center;
        }
        
        h1 {
            color: #fff;
            margin-top: 0;
        }
        
        canvas {
            border: 3px solid #fff;
            background-color: #000;
            display: block;
            margin: 20px auto;
        }
        
        p {
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>Pong Game</h1>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <p>A simple Pong game built with pure JavaScript</p>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
